<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tu Dulce Evento</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="shortcut icon" href="../assets/img/favicon.png" type="image/x-icon">
</head>
<body class="rellenos">
    <header>
        <div class="header">
            <img class="logo" src="../assets/img/perfil-fb.jpg" alt="Logo">
            <h1>TU DULCE EVENTO</h1>
            <div class="carrito-icono">
                <a href="./Carrito.html">
                    <img src="https://cdn-icons-png.flaticon.com/512/263/263142.png" alt="Carrito">
                    <span class="contador"></span>
                </a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="../Index.html">Inicio</a></li>
                <li><a href="./Rellenos.html">Rellenos</a></li>
                <li><a href="./Coberturas.html">Coberturas</a></li>
                <li><a href="./Decoracion.html">Decoración</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto">
            <h2>Formulario de Contacto</h2>
            <form action="https://formspree.io/f/mqaqjndk" method="POST" class="formulario-contacto">
                <br>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="name" required placeholder="Ingrese su nombre" maxlength="20" minlength="10">
                <br><br>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="pepe@gmail.com"
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                    <br><br>

                <fieldset>
                    
                    <legend>Tema a Consultar</legend>
                    <label><input type="radio" name="Tema" value="Decoracion" required> Decoración</label><br>
                    <label><input type="radio" name="Tema" value="Rellenos"> Rellenos</label><br>
                    <label><input type="radio" name="Tema" value="Coberturas"> Coberturas</label>
                </fieldset>

                <br><br>
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" rows="20" cols="100" placeholder="Escribe tu mensaje" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <a href="https://wa.me/1234567890" class="social-button whatsapp" target="_blank" aria-label="WhatsApp">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://instagram.com/tudulceevento/?hl=es" class="social-button instagram" target="_blank" aria-label="Instagram">
            <i class="fab fa-instagram"></i> Instagram
        </a>
    </footer>
    <script src="../JS/Main.js"></script>
</body>
</html>
